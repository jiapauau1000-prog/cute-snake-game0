<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>可愛粉紅蛇 AI 遊戲</title>
    <style>
        body {
            background: var(--bg-gradient, linear-gradient(180deg, #ffe9f6 0%, #ffd8ee 100%));
            color: var(--text-color, #ff4fa3);
            text-align: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
            margin: 0;
            min-height: 100vh;
        }
        .bg-bubble {
            position: fixed;
            bottom: -80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            box-shadow: inset -8px -8px 14px rgba(255, 180, 220, 0.35);
            animation: floatUp linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floatUp {
            from { transform: translateY(0); opacity: 0.75; }
            to { transform: translateY(-120vh); opacity: 0.12; }
        }
        .wrap {
            position: relative;
            z-index: 1;
            padding-top: 12px;
        }
        canvas {
            border: 5px solid var(--canvas-border, #ffb6d9);
            background-color: var(--canvas-bg, #ffdff0);
            display: block;
            margin: 20px auto;
            border-radius: 15px;
            box-shadow: 0 0 15px var(--canvas-shadow, rgba(255,182,217,0.6));
        }
        .ui {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px #fff;
        }
        .btns { margin: 8px 0 0; }
        .mobile-controls {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 56px 56px;
            gap: 8px;
            justify-content: center;
            margin: 10px auto 8px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .dpad-btn {
            border: none;
            border-radius: 14px;
            background: var(--dpad-bg, #ff9fcf);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px var(--dpad-shadow, rgba(255, 130, 190, 0.35));
            cursor: pointer;
            animation: none;
        }
        .dpad-btn:active { transform: scale(0.96); }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        button {
            border: none;
            border-radius: 999px;
            background: var(--btn-bg, #ff6eb6);
            color: #fff;
            font-weight: bold;
            padding: 10px 18px;
            margin: 0 6px;
            cursor: pointer;
            box-shadow: 0 5px 10px var(--btn-shadow, rgba(255, 110, 182, 0.3));
            animation: bob 1.8s ease-in-out infinite;
        }
        button:hover { background: var(--btn-hover, #ff4fa3); }
        @keyframes bob {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.04); }
        }
    </style>
</head>
<body>
    <div class="bg-bubble" style="left:8%; width:70px; height:70px; animation-duration:15s;"></div>
    <div class="bg-bubble" style="left:22%; width:36px; height:36px; animation-duration:11s;"></div>
    <div class="bg-bubble" style="left:39%; width:52px; height:52px; animation-duration:13s;"></div>
    <div class="bg-bubble" style="left:57%; width:28px; height:28px; animation-duration:10s;"></div>
    <div class="bg-bubble" style="left:73%; width:64px; height:64px; animation-duration:14s;"></div>
    <div class="bg-bubble" style="left:88%; width:42px; height:42px; animation-duration:12s;"></div>

    <div class="wrap">
        <h1 style="margin-top:20px;">可愛蛇蛇大冒險</h1>
        <div class="ui" id="msg">按下「開始遊戲」或方向鍵開始 (↑ ↓ ← →)</div>
        <div class="btns">
            <button id="startBtn">開始遊戲</button>
            <button id="restartBtn" style="display:none;">重新開始</button>
            <button id="trailBtn">特效：開啟</button>
            <button id="themeBtn">更換顏色</button>
        </div>
        <div class="mobile-controls" aria-label="觸控方向鍵">
            <button class="dpad-btn dpad-up" id="upBtn" aria-label="上">↑</button>
            <button class="dpad-btn dpad-left" id="leftBtn" aria-label="左">←</button>
            <button class="dpad-btn dpad-down" id="downBtn" aria-label="下">↓</button>
            <button class="dpad-btn dpad-right" id="rightBtn" aria-label="右">→</button>
        </div>
        <canvas id="game" width="400" height="400"></canvas>
        <div class="ui" id="score">分數: 0 | 最高分: 0</div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const msgEl = document.getElementById('msg');
        const scoreEl = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const trailBtn = document.getElementById('trailBtn');
        const themeBtn = document.getElementById('themeBtn');
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        let snake = [{x: 200, y: 200}, {x: 180, y: 200}, {x: 160, y: 200}];
        let food = {x: 60, y: 60};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = Number(localStorage.getItem('snakeHigh') || 0);
        let isGameOver = false;
        let isStarted = false;
        let particles = [];
        let rainbowTrail = [];
        let rainbowFrames = 0;
        let trailEffectEnabled = true;
        let frameCount = 0;
        let audioCtx;
        let holdTimer = null;
        let holdDirection = null;
        const themes = [
            {
                name: "粉紅泡泡",
                bgGradient: "linear-gradient(180deg, #ffe9f6 0%, #ffd8ee 100%)",
                textColor: "#ff4fa3",
                canvasBorder: "#ffb6d9",
                canvasBg: "#ffdff0",
                canvasShadow: "rgba(255,182,217,0.6)",
                btnBg: "#ff6eb6",
                btnHover: "#ff4fa3",
                btnShadow: "rgba(255, 110, 182, 0.3)",
                dpadBg: "#ff9fcf",
                dpadShadow: "rgba(255, 130, 190, 0.35)",
                snakeHead: "#ff4fa3",
                snakeBody: "#ff8fc7",
                faceDark: "#7a1e4f",
                faceLight: "#b13473"
            },
            {
                name: "奶油薄荷",
                bgGradient: "linear-gradient(180deg, #eafff7 0%, #ccf6e9 100%)",
                textColor: "#27a285",
                canvasBorder: "#8edec7",
                canvasBg: "#dffbf2",
                canvasShadow: "rgba(142,222,199,0.55)",
                btnBg: "#4ec9a8",
                btnHover: "#2ea78b",
                btnShadow: "rgba(78, 201, 168, 0.3)",
                dpadBg: "#78dabb",
                dpadShadow: "rgba(78, 201, 168, 0.35)",
                snakeHead: "#40c7a3",
                snakeBody: "#8fe5cc",
                faceDark: "#1e6f5c",
                faceLight: "#2f9c82"
            },
            {
                name: "夢幻薰衣草",
                bgGradient: "linear-gradient(180deg, #f3eaff 0%, #e4d6ff 100%)",
                textColor: "#8e5cff",
                canvasBorder: "#c7aefc",
                canvasBg: "#efe6ff",
                canvasShadow: "rgba(190,167,249,0.55)",
                btnBg: "#a77bff",
                btnHover: "#8e5cff",
                btnShadow: "rgba(142, 92, 255, 0.3)",
                dpadBg: "#b897ff",
                dpadShadow: "rgba(142, 92, 255, 0.35)",
                snakeHead: "#9a6dff",
                snakeBody: "#ccb5ff",
                faceDark: "#51308f",
                faceLight: "#744cc6"
            }
        ];
        const savedThemeIndex = Number(localStorage.getItem("snakeThemeIndex") || 0);
        let currentThemeIndex = Number.isInteger(savedThemeIndex) && savedThemeIndex >= 0 && savedThemeIndex < themes.length
            ? savedThemeIndex
            : 0;

        function applyTheme(theme) {
            document.body.style.setProperty("--bg-gradient", theme.bgGradient);
            document.body.style.setProperty("--text-color", theme.textColor);
            document.body.style.setProperty("--canvas-border", theme.canvasBorder);
            document.body.style.setProperty("--canvas-bg", theme.canvasBg);
            document.body.style.setProperty("--canvas-shadow", theme.canvasShadow);
            document.body.style.setProperty("--btn-bg", theme.btnBg);
            document.body.style.setProperty("--btn-hover", theme.btnHover);
            document.body.style.setProperty("--btn-shadow", theme.btnShadow);
            document.body.style.setProperty("--dpad-bg", theme.dpadBg);
            document.body.style.setProperty("--dpad-shadow", theme.dpadShadow);
            themeBtn.innerText = `更換顏色：${theme.name}`;
        }

        scoreEl.innerText = `分數: 0 | 最高分: ${highScore}`;
        applyTheme(themes[currentThemeIndex]);

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === "suspended") audioCtx.resume();
        }

        function playTone(freq, duration, type, gainValue) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.value = gainValue;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playEatSound() {
            playTone(780, 0.08, "triangle", 0.06);
            setTimeout(() => playTone(980, 0.1, "triangle", 0.055), 60);
        }

        function playGameOverSound() {
            playTone(300, 0.12, "sawtooth", 0.05);
            setTimeout(() => playTone(220, 0.2, "sawtooth", 0.045), 90);
        }

        function startGame() {
            initAudio();
            if (isGameOver) return;
            if (!isStarted) {
                isStarted = true;
                if (dx === 0 && dy === 0) dx = 20;
                msgEl.innerText = "開始遊戲！";
            }
        }

        function setDirection(direction) {
            if (direction === "up" && dy === 0) { dx = 0; dy = -20; startGame(); }
            if (direction === "down" && dy === 0) { dx = 0; dy = 20; startGame(); }
            if (direction === "left" && dx === 0) { dx = -20; dy = 0; startGame(); }
            if (direction === "right" && dx === 0) { dx = 20; dy = 0; startGame(); }
        }

        function vibratePulse(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function startHold(direction) {
            stopHold();
            holdDirection = direction;
            setDirection(direction);
            vibratePulse(18);
            holdTimer = setInterval(() => {
                if (!holdDirection) return;
                setDirection(holdDirection);
                vibratePulse(10);
            }, 140);
        }

        function stopHold() {
            holdDirection = null;
            if (holdTimer) {
                clearInterval(holdTimer);
                holdTimer = null;
            }
        }

        function resetGame() {
            snake = [{x: 200, y: 200}, {x: 180, y: 200}, {x: 160, y: 200}];
            food = {x: 60, y: 60};
            dx = 0;
            dy = 0;
            score = 0;
            particles = [];
            rainbowTrail = [];
            rainbowFrames = 0;
            isGameOver = false;
            isStarted = false;
            msgEl.innerText = "按下「開始遊戲」或方向鍵開始 (↑ ↓ ← →)";
            msgEl.style.color = themes[currentThemeIndex].textColor;
            restartBtn.style.display = "none";
            scoreEl.innerText = `分數: 0 | 最高分: ${highScore}`;
            draw();
        }

        function spawnFood() {
            food = {x: Math.floor(Math.random() * 19) * 20, y: Math.floor(Math.random() * 19) * 20};
        }

        function createParticles(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x + 10,
                    y: y + 10,
                    vx: (Math.random() - 0.5) * 2.8,
                    vy: (Math.random() - 0.5) * 2.8,
                    size: Math.random() * 3 + 2,
                    life: 30
                });
            }
        }

        function updateParticles() {
            particles = particles.filter((p) => p.life > 0);
            particles.forEach((p) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.03;
                p.life -= 1;
            });
        }

        function gameLoop() {
            frameCount += 1;
            if (isGameOver || !isStarted) {
                draw();
                return;
            }

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            if (
                head.x < 0 || head.x >= 400 ||
                head.y < 0 || head.y >= 400 ||
                snake.some((s) => s.x === head.x && s.y === head.y)
            ) {
                isGameOver = true;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHigh', String(score));
                }
                msgEl.innerText = "遊戲結束！撞到了，按「重新開始」或空白鍵";
                msgEl.style.color = themes[currentThemeIndex].snakeHead;
                restartBtn.style.display = "inline-block";
                scoreEl.innerText = `分數: ${score} | 最高分: ${highScore}`;
                playGameOverSound();
                draw();
                return;
            }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                spawnFood();
                if (trailEffectEnabled) {
                    createParticles(head.x, head.y);
                    rainbowFrames = 24;
                }
                playEatSound();
                scoreEl.innerText = `分數: ${score} | 最高分: ${highScore}`;
            } else {
                snake.pop();
            }

            updateRainbowTrail();
            updateParticles();
            draw();
        }

        function updateRainbowTrail() {
            if (!trailEffectEnabled) {
                rainbowTrail = [];
                rainbowFrames = 0;
                return;
            }
            if (rainbowFrames > 0) {
                rainbowTrail.unshift({x: snake[0].x + 10, y: snake[0].y + 10, life: 24});
                rainbowFrames -= 1;
            }
            rainbowTrail = rainbowTrail
                .map((r) => ({...r, life: r.life - 1}))
                .filter((r) => r.life > 0)
                .slice(0, 60);
        }

        function drawBubble(x, y, size, fillStyle) {
            const r = size / 2;
            const cx = x + r;
            const cy = y + r;
            ctx.fillStyle = fillStyle;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.55)";
            ctx.beginPath();
            ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.25, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawHeadFace(head) {
            const cx = head.x + 10;
            const cy = head.y + 10;
            const blink = frameCount % 36 < 4;
            const theme = themes[currentThemeIndex];
            ctx.strokeStyle = theme.faceDark;
            ctx.lineWidth = 2;
            if (blink) {
                ctx.beginPath();
                ctx.moveTo(cx - 4, cy - 2);
                ctx.lineTo(cx - 1, cy - 2);
                ctx.moveTo(cx + 1, cy - 2);
                ctx.lineTo(cx + 4, cy - 2);
                ctx.stroke();
            } else {
                ctx.fillStyle = theme.faceDark;
                ctx.beginPath();
                ctx.arc(cx - 3, cy - 1, 1.5, 0, Math.PI * 2);
                ctx.arc(cx + 3, cy - 1, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.strokeStyle = theme.faceLight;
            ctx.beginPath();
            ctx.arc(cx, cy + 2, 2.2, 0, Math.PI);
            ctx.stroke();
        }

        function drawHeart(x, y, size) {
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            const topY = y + size * 0.3;
            ctx.moveTo(x + size / 2, topY);
            ctx.bezierCurveTo(x + size / 2, y, x, y, x, topY);
            ctx.bezierCurveTo(x, y + size * 0.6, x + size / 2, y + size, x + size / 2, y + size);
            ctx.bezierCurveTo(x + size / 2, y + size, x + size, y + size * 0.6, x + size, topY);
            ctx.bezierCurveTo(x + size, y, x + size / 2, y, x + size / 2, topY);
            ctx.fill();
        }

        function drawParticles() {
            if (!trailEffectEnabled) return;
            particles.forEach((p) => {
                const alpha = Math.max(p.life / 30, 0);
                ctx.fillStyle = `rgba(255, 255, 180, ${alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawRainbowTrail() {
            if (!trailEffectEnabled) return;
            const colors = ["#ff4fa3", "#ff8a5b", "#ffd84d", "#8cff8c", "#7ec8ff", "#b58cff"];
            rainbowTrail.forEach((r, i) => {
                const alpha = Math.max(r.life / 24, 0);
                const color = colors[i % colors.length];
                ctx.fillStyle = `${color}${Math.round(alpha * 255).toString(16).padStart(2, "0")}`;
                ctx.beginPath();
                ctx.arc(r.x, r.y, 5 * alpha + 1.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function draw() {
            ctx.clearRect(0, 0, 400, 400);
            drawRainbowTrail();
            drawHeart(food.x, food.y, 18);
            snake.forEach((s, i) => {
                const theme = themes[currentThemeIndex];
                const color = i === 0 ? theme.snakeHead : theme.snakeBody;
                drawBubble(s.x + 1, s.y + 1, 18, color);
            });
            drawHeadFace(snake[0]);
            drawParticles();
        }

        setInterval(gameLoop, 120);

        startBtn.addEventListener("click", startGame);
        restartBtn.addEventListener("click", resetGame);
        trailBtn.addEventListener("click", () => {
            trailEffectEnabled = !trailEffectEnabled;
            trailBtn.innerText = `特效：${trailEffectEnabled ? "開啟" : "關閉"}`;
            if (!trailEffectEnabled) {
                particles = [];
                rainbowTrail = [];
                rainbowFrames = 0;
            }
            draw();
        });
        themeBtn.addEventListener("click", () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
            localStorage.setItem("snakeThemeIndex", String(currentThemeIndex));
            if (!isGameOver) msgEl.style.color = themes[currentThemeIndex].textColor;
            draw();
        });
        upBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startHold("up"); }, {passive: false});
        downBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startHold("down"); }, {passive: false});
        leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startHold("left"); }, {passive: false});
        rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startHold("right"); }, {passive: false});
        upBtn.addEventListener("touchend", stopHold);
        downBtn.addEventListener("touchend", stopHold);
        leftBtn.addEventListener("touchend", stopHold);
        rightBtn.addEventListener("touchend", stopHold);
        upBtn.addEventListener("touchcancel", stopHold);
        downBtn.addEventListener("touchcancel", stopHold);
        leftBtn.addEventListener("touchcancel", stopHold);
        rightBtn.addEventListener("touchcancel", stopHold);
        upBtn.addEventListener("pointerdown", () => startHold("up"));
        downBtn.addEventListener("pointerdown", () => startHold("down"));
        leftBtn.addEventListener("pointerdown", () => startHold("left"));
        rightBtn.addEventListener("pointerdown", () => startHold("right"));
        upBtn.addEventListener("pointerup", stopHold);
        downBtn.addEventListener("pointerup", stopHold);
        leftBtn.addEventListener("pointerup", stopHold);
        rightBtn.addEventListener("pointerup", stopHold);
        upBtn.addEventListener("pointerleave", stopHold);
        downBtn.addEventListener("pointerleave", stopHold);
        leftBtn.addEventListener("pointerleave", stopHold);
        rightBtn.addEventListener("pointerleave", stopHold);
        upBtn.addEventListener("click", () => setDirection("up"));
        downBtn.addEventListener("click", () => setDirection("down"));
        leftBtn.addEventListener("click", () => setDirection("left"));
        rightBtn.addEventListener("click", () => setDirection("right"));

        document.onkeydown = (e) => {
            if (isGameOver && e.code === 'Space') {
                resetGame();
                return;
            }
            if (e.key === 'ArrowUp') setDirection("up");
            if (e.key === 'ArrowDown') setDirection("down");
            if (e.key === 'ArrowLeft') setDirection("left");
            if (e.key === 'ArrowRight') setDirection("right");
        };

        draw();
    </script>
</body>
</html>
